services:
  db:
    image: postgres:15
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hotel_booking
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    container_name: db_gui
    restart: always
    ports:
      - "8081:8081"